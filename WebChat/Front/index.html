<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Aquí se insertarán los mensajes -->
    <div id="contenedor-chats" class="content">
        <template id="tpl-recibido">
            <div class="mensaje_recibido">
                <p class="texto-mensaje"></p>
             </div>
        </template>
    
        <template id="tpl-enviado">
            <div class="mensaje_enviado">
                <p class="texto-mensaje"></p>
            </div>
        </template>
    </div>

    <!-- Form para enviar mensajes -->
    <div class="send_message">
        <form action="">
            <input type="text" placeholder="Escribe aquí...">
            <button type="submit">Send</button>
        </form>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="codigo.js"></script>
</body>
</html>
